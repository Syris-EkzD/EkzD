[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekzd"
dynamic = ["version"]
description = "A deterministic structural trust layer for scoped AI-assisted development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ekzd = "ekzd.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ekzd.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
