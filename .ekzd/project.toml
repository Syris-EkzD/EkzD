schema_version = 1

[project]
name = "EkzD"

[sources]
paths = [
  "README.md",
  "VERIFICATION.md",
  "pyproject.toml",
  "src/ekzd/__init__.py",
  "src/ekzd/cli.py",
  "src/ekzd/core.py",
  "src/ekzd/workflow.py",
  "src/ekzd/ui.py",
  "tests/test_cli.py",
  "tests/test_core.py",
  "tests/test_verification_side_effects.py",
  "tests/test_workflow_ux.py",
]

[scope]
include = [
  "README.md",
  "VERIFICATION.md",
  "src/ekzd/cli.py",
  "src/ekzd/core.py",
  "src/ekzd/workflow.py",
  "src/ekzd/ui.py",
  "src/ekzd/task.py",
  "src/ekzd/check.py",
  "src/ekzd/worker.py",
  "tests/test_cli.py",
  "tests/test_core.py",
  "tests/test_verification_side_effects.py",
  "tests/test_workflow_ux.py",
  "tests/test_task_manifest.py",
  "tests/test_worker_check.py",
]

exclude = [
  "pyproject.toml",
  "src/ekzd/__init__.py",
  "src/ekzd/interactive.py",
  "src/ekzd/terminal.py",
  ".github/**",
  ".ekzd/**",
]

constraints = [
  "Introduce a stateless worker-side deterministic checking workflow without replacing or weakening the existing session-based EkzD workflow.",
  "Add an explicit `ekzd check --task <path>` command for implementation workers.",
  "`ekzd check` must not require an active EkzD session and must not read, create, update, finish, abort, or otherwise depend on `.ekzd/session.json`.",
  "The task manifest must be a standalone TOML file that may live outside the repository.",
  "Task manifest schema version 1 must separate current-task authority from repository-level project configuration.",
  "Task manifest schema version 1 must require an objective, exact baseline Git commit SHA, implementation branch, allowed scope, acceptance criteria, and bounded commit ceiling.",
  "The task manifest may optionally declare a repository identity and task-specific verification steps.",
  "Task-specific verification steps may add checks but must never remove, replace, disable, or weaken project verification steps.",
  "Project verification steps for worker checking must be loaded from `.ekzd/project.toml` at the immutable task baseline commit rather than trusting the mutable working-tree copy.",
  "For this task, worker checking may consume project identity and project verification configuration from baseline `.ekzd/project.toml`; do not redesign the entire project configuration schema in this change.",
  "The worker checker must remain programming-language, framework, package-manager, and build-system agnostic.",
  "Do not add hard-coded Flutter, Dart, JavaScript, TypeScript, Python, .NET, Rust, C, Godot, or other stack-specific behavior.",
  "All stack-specific quality checking must be expressed through configured executable verification commands.",
  "`ekzd check` must support dirty working trees so implementation agents can check work before committing.",
  "Development-mode results must be bound to the exact current HEAD plus an EkzD worktree fingerprint covering relevant staged, unstaged, and untracked non-ignored work.",
  "Add `ekzd check --final --task <path>` for candidate handoff verification.",
  "`--final` must require a clean reviewable working tree and bind the result to the exact final Git HEAD.",
  "The checker must verify that the task baseline remains an ancestor of the current HEAD before relying on baseline-relative Git checks.",
  "The checker must verify the declared implementation branch.",
  "The checker must enforce the task commit ceiling using the existing EkzD commit-counting semantics where applicable.",
  "The checker must enforce task include/exclude scope against all relevant changes from the frozen baseline through the current committed and uncommitted working state.",
  "The checker must protect EkzD project configuration from implementation changes and preserve existing Git visibility and protected-history trust guarantees where applicable.",
  "Required deterministic checks must use the result states PASS, FAIL, UNAVAILABLE, and WARN.",
  "PASS means the check ran and succeeded.",
  "FAIL means the check ran and detected a blocking violation.",
  "UNAVAILABLE means a required check could not be executed or evaluated and is blocking.",
  "WARN means a non-blocking observation and must not by itself make the overall result fail.",
  "A missing required executable or otherwise unavailable required checker must be reported explicitly as UNAVAILABLE and must never be silently skipped or reported as PASS.",
  "Run as many independent checks as safely practical and collect multiple independent failures in one invocation instead of stopping at the first ordinary failure.",
  "A failed or unavailable verification step must not prevent unrelated independent verification steps from running.",
  "If continuing after a particular failure would make later results unsafe or misleading, dependent checks may be reported unavailable with an explicit reason.",
  "EkzD itself must remain observational and must never repair, format, rewrite, commit, stage, reset, restore, or otherwise modify implementation source or Git history.",
  "Configured verification commands may create ignored temporary or build artifacts, but they must not modify tracked project content.",
  "EkzD must detect tracked project mutations caused by a verification command, report them as a blocking failure, and must not silently restore those mutations.",
  "Do not use shell=True for configured verification commands; preserve argv-array execution semantics.",
  "Support human-readable output for `ekzd check`.",
  "Support machine-readable `ekzd check --json` output suitable for a future orchestrator.",
  "`--json` check execution must produce a structured result containing overall status, development/final mode, task identity, baseline, current HEAD, worktree cleanliness/fingerprint information, and individual check results with actionable diagnostics.",
  "Machine-readable check results must be bound to the Git/worktree state that was actually evaluated.",
  "Overall readiness passes only when no required result is FAIL or UNAVAILABLE; WARN remains non-blocking.",
  "Return exit code 0 when the overall check passes and exit code 1 for blocking FAIL or UNAVAILABLE results; ordinary argparse usage errors may retain argparse exit code 2.",
  "Preserve existing `init`, `start`, `status`, `prompt`, `context`, `verify`, `handoff`, `abort`, and `finish` behavior unless a narrowly necessary internal refactor is required to share deterministic checking primitives.",
  "Do not make the existing session workflow depend on the new task manifest.",
  "Do not add orchestration, networking, GitHub API behavior, AI/model review, background services, automatic repair, or automatic commits.",
  "Do not redesign `.ekzd/project.toml` into its final long-term permanent-project format in this task.",
  "Do not implement final EkzD exact build-identity pinning in this task; preserve room for that as a separate follow-up after worker checking is stable.",
  "Use only the Python standard library and add no runtime dependencies.",
  "Every worker-check result must identify the exact task manifest evaluated using a deterministic SHA-256 digest of the task manifest's exact bytes.",
  "When the task manifest declares a repository identity, EkzD must compare it against the current checkout's sanitized origin repository identity; credentials must never appear in diagnostics or machine-readable output.",
  "When `--json` is requested, worker-check failures that occur after successful CLI argument parsing, including task-manifest validation and deterministic precondition failures, must still produce one valid machine-readable JSON result rather than falling back to human-only error output.",
]

[authority]
may = [
  "Add a standalone task-manifest parser and validator.",
  "Add worker-checking modules under the explicitly allowed source paths.",
  "Add `ekzd check` with `--task`, `--final`, and `--json` options.",
  "Reuse or refactor existing Git state, fingerprint, scope, verification, repository-identity, commit-count, and protected-history primitives when doing so preserves existing session behavior.",
  "Add baseline-ref project configuration loading that reads `.ekzd/project.toml` from the frozen task baseline.",
  "Add deterministic aggregation of multiple check results.",
  "Add explicit detection and reporting of unavailable required verification commands.",
  "Add detection of tracked-file mutations caused by configured verification commands.",
  "Add human-readable worker-check rendering.",
  "Add machine-readable worker-check JSON output.",
  "Document the worker-check workflow, task-manifest format, result states, development checking, final checking, and its relationship to the existing session workflow.",
  "Add focused unit and integration tests covering the new worker-check behavior.",
]

requires_approval = [
  "Changing the agreed task-manifest responsibility split.",
  "Changing existing session verification or acceptance semantics beyond a behavior-preserving internal refactor.",
  "Changing existing commit-counting semantics.",
  "Changing existing Git visibility semantics.",
  "Changing existing explicit CLI commands or removing existing CLI functionality.",
  "Changing the long-term project configuration model beyond what is minimally needed for baseline verification-step loading.",
  "Adding runtime dependencies.",
  "Adding networking, GitHub integration, orchestration, AI/model functionality, background behavior, automatic repair, or source mutation.",
  "Implementing exact EkzD build-identity pinning in this task.",
]

may_not = [
  "Modify `pyproject.toml`.",
  "Modify `src/ekzd/__init__.py`.",
  "Modify `src/ekzd/interactive.py`.",
  "Modify `src/ekzd/terminal.py`.",
  "Modify `.github/**`.",
  "Modify `.ekzd/project.toml` or `.ekzd/session.json` during the implementation session.",
  "Make worker checking require an active session.",
  "Write worker-check results into `.ekzd/session.json`.",
  "Allow task-specific checks to disable project checks.",
  "Silently skip unavailable required checks.",
  "Automatically modify source code or Git state.",
  "Hard-code support for specific languages or frameworks.",
  "Add automatic commit creation, squashing, rebasing, merging, or history rewriting.",
  "Add an AI reviewer.",
]

[session]
max_commits = 20

[acceptance]
criteria = [
  "`ekzd check --task <path>` works without an active EkzD session.",
  "Worker checking neither requires nor mutates `.ekzd/session.json`.",
  "A schema-version-1 standalone TOML task manifest is validated and contains the frozen task objective, baseline SHA, implementation branch, include/exclude scope, acceptance criteria, and commit ceiling.",
  "The task manifest can be located outside the repository.",
  "An optional task repository identity can be validated without exposing credentials.",
  "Project verification steps used by worker checking are loaded from `.ekzd/project.toml` at the exact task baseline commit.",
  "Task-specific verification steps are additive and cannot remove or weaken project verification steps.",
  "The worker checker contains no target-stack-specific verification logic.",
  "Development checking supports staged, unstaged, and untracked non-ignored implementation work without requiring commits.",
  "Development results identify the exact HEAD and worktree fingerprint that were checked.",
  "`ekzd check --final --task <path>` rejects a dirty handoff candidate.",
  "A successful final result is bound to the exact clean final HEAD.",
  "A baseline that is not an ancestor of current HEAD produces a blocking result rather than an unreliable scope calculation.",
  "A branch mismatch produces a blocking result.",
  "The configured task commit ceiling is enforced.",
  "Changes outside task include scope or inside task exclude scope are reported as blocking failures for both committed and relevant uncommitted work.",
  "Protected EkzD project configuration cannot be changed unnoticed during worker implementation.",
  "Required checks expose PASS, FAIL, UNAVAILABLE, or WARN states.",
  "Missing required tooling is reported as UNAVAILABLE with an actionable diagnostic and blocks overall readiness.",
  "Independent failures are aggregated when safely possible rather than ordinary checking stopping at the first failure.",
  "Project verification continues across independent command failures when safe to do so.",
  "A verification command that changes tracked project content is detected and produces a blocking failure; EkzD does not restore or otherwise rewrite the changed files.",
  "EkzD performs no implementation repair, formatting, staging, committing, resetting, restoration, rebasing, merging, or other source/history mutation itself.",
  "`ekzd check` provides useful human-readable diagnostics.",
  "`ekzd check --json` emits structured machine-readable results suitable for later orchestration.",
  "JSON results include overall status, mode, task/baseline identity, current Git state binding, and individual actionable check results.",
  "Exit code is 0 only when no required result is FAIL or UNAVAILABLE; WARN alone remains successful.",
  "Existing session-based `init`, `start`, `status`, `prompt`, `context`, `verify`, `handoff`, `abort`, and `finish` workflows continue to pass their existing tests.",
  "No runtime dependency is added.",
  "README.md and/or VERIFICATION.md document how worker checking differs from the legacy session lifecycle and show a minimal task manifest plus development/final check examples.",
  "All configured verification passes.",
  "Human-readable and JSON results include a deterministic SHA-256 digest identifying the exact task manifest that was evaluated.",
  "A declared repository identity that does not match the sanitized current checkout identity produces a blocking result without exposing credentials.",
  "`ekzd check --json` remains valid machine-readable JSON for manifest-validation and worker-check precondition failures after CLI argument parsing.",
]

[verification]

[[verification.steps]]
name = "compile"
command = ["python3", "-m", "compileall", "-q", "src", "tests"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "tests"
command = ["env", "PYTHONPATH=src", "python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
cwd = "."
timeout_seconds = 600

[[verification.steps]]
name = "cli-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--help"]
cwd = "."
timeout_seconds = 120
