schema_version = 1

[project]
name = "EkzD"

[sources]
paths = [
  "README.md",
  "VERIFICATION.md",
  "pyproject.toml",
  "src/ekzd/__init__.py",
  "src/ekzd/cli.py",
  "src/ekzd/core.py",
  "src/ekzd/workflow.py",
  "src/ekzd/ui.py",
  "src/ekzd/check.py",
  "src/ekzd/task.py",
  "src/ekzd/worker.py",
  "tests/test_cli.py",
  "tests/test_core.py",
  "tests/test_ui.py",
  "tests/test_workflow_ux.py",
  "tests/test_worker_check.py",
]

[scope]
include = [
  "README.md",
  "VERIFICATION.md",
  "src/ekzd/cli.py",
  "src/ekzd/core.py",
  "src/ekzd/workflow.py",
  "src/ekzd/ui.py",
  "src/ekzd/interactive.py",
  "src/ekzd/terminal.py",
  "tests/test_cli.py",
  "tests/test_core.py",
  "tests/test_interactive.py",
  "tests/test_terminal.py",
  "tests/test_ui.py",
  "tests/test_workflow_ux.py",
]

exclude = [
  "pyproject.toml",
  "src/ekzd/__init__.py",
  "src/ekzd/check.py",
  "src/ekzd/task.py",
  "src/ekzd/worker.py",
  "tests/test_task_manifest.py",
  "tests/test_worker_check.py",
  "tests/test_verification_side_effects.py",
  ".github/**",
  ".ekzd/**",
]

constraints = [
  "Simplify EkzD around its deterministic harness and worker-check responsibilities by removing interactive terminal/TUI functionality and the dedicated semantic handoff-notes feature.",
  "Delete the bare interactive EkzD terminal application rather than replacing it with another menu, dashboard, full-screen interface, prompt loop, or TUI.",
  "Delete `src/ekzd/interactive.py` and `src/ekzd/terminal.py` and remove their production imports and integration points.",
  "Delete tests whose sole purpose is the removed interactive or terminal implementation rather than preserving obsolete compatibility behavior.",
  "Running bare `ekzd` with no subcommand must become a deterministic non-interactive operation that prints ordinary CLI help and exits successfully without reading interactive input, entering an alternate screen, manipulating terminal mouse modes, or accessing the clipboard.",
  "Preserve the explicit `init`, `start`, `status`, `prompt`, `context`, `verify`, `check`, `abort`, and `finish` CLI commands.",
  "Remove the dedicated `ekzd handoff --done/--next` command.",
  "Remove the corresponding semantic handoff-note mutation API and UI rendering that exist only for the removed `ekzd handoff` command.",
  "Newly created session state must no longer create or require the obsolete semantic handoff-note `done`/`next` container.",
  "Legacy persisted session state containing an extra historical `handoff` field must remain safely readable; no migration or rewriting of existing session files is required.",
  "Do not remove or rename the general concept of an implementation handoff used by `ekzd prompt`, worker-check finalization, documentation, or ordinary workflow language.",
  "`ekzd prompt` must remain the deterministic implementation-contract renderer and retain its existing task-contract semantics.",
  "`ekzd status` must remain the operator-facing explicit workflow-status command.",
  "`ekzd context` and `ekzd context --json` must remain available.",
  "`ekzd verify`, acceptance binding, exact-state verification, scope enforcement, protected-history enforcement, commit ceilings, and existing Git visibility guarantees must not be weakened.",
  "`ekzd check`, task manifests, stateless worker checking, result-state aggregation, repository identity checking, and worker verification behavior must remain unchanged.",
  "Remove TUI-only or handoff-note-only helpers from `src/ekzd/ui.py` when they become unused, but retain the human-readable rendering required by explicit CLI commands.",
  "Remove documentation describing the deleted interactive terminal interface, clipboard controls, alternate-screen behavior, or dedicated handoff-note command.",
  "Update documentation so the supported V1.1 workflow reflects the simpler explicit-command interface.",
  "Do not add a replacement interactive framework or runtime dependency.",
  "Do not implement EkzD build/version identity pinning in this task; that remains the next separate task.",
  "Do not redesign the task-manifest format or long-term project configuration model in this task.",
  "Use only the Python standard library and add no runtime dependencies.",
  "Prefer deletion and simplification over abstractions whose only purpose is preserving removed functionality.",
]

[authority]
may = [
  "Delete `src/ekzd/interactive.py` and `src/ekzd/terminal.py`.",
  "Delete `tests/test_interactive.py` and `tests/test_terminal.py` when their coverage is specific to the removed functionality.",
  "Remove the `handoff` CLI parser and dispatch path.",
  "Remove `update_handoff`, handoff-note session initialization, and handoff-note-specific UI rendering.",
  "Simplify `src/ekzd/cli.py` so bare invocation prints normal help without entering an interactive application.",
  "Remove TUI-only helpers and dead presentation code from `src/ekzd/ui.py`.",
  "Adjust remaining CLI, core, workflow, and UI tests for the intentionally simplified public surface.",
  "Update README.md and VERIFICATION.md to document the supported explicit-command workflow.",
  "Add focused regression tests proving retained commands and worker checking remain available after simplification.",
]

requires_approval = [
  "Removing or renaming any explicit retained command: init, start, status, prompt, context, verify, check, abort, or finish.",
  "Changing `ekzd prompt` contract semantics.",
  "Changing worker-check or task-manifest semantics.",
  "Changing verification or acceptance trust semantics.",
  "Changing scope, commit-counting, protected-history, fingerprint, or Git-visibility semantics.",
  "Changing `.ekzd/project.toml` schema.",
  "Adding runtime dependencies.",
  "Adding networking, GitHub API integration, orchestration, AI/model functionality, background behavior, automatic repair, or source mutation.",
  "Implementing exact EkzD build/version identity pinning.",
]

may_not = [
  "Modify `pyproject.toml`.",
  "Modify `src/ekzd/__init__.py`.",
  "Modify `src/ekzd/check.py`.",
  "Modify `src/ekzd/task.py`.",
  "Modify `src/ekzd/worker.py`.",
  "Modify `tests/test_task_manifest.py`.",
  "Modify `tests/test_worker_check.py`.",
  "Modify `tests/test_verification_side_effects.py`.",
  "Modify `.github/**`.",
  "Modify `.ekzd/project.toml` or `.ekzd/session.json` during the implementation session.",
  "Replace the removed terminal application with another TUI or interactive menu system.",
  "Remove `ekzd prompt` or worker final-handoff behavior merely because they use the word handoff.",
  "Weaken existing deterministic verification or acceptance guarantees.",
  "Add runtime dependencies.",
  "Implement build/version identity pinning.",
]

[session]
max_commits = 8

[acceptance]
criteria = [
  "`src/ekzd/interactive.py` and `src/ekzd/terminal.py` are removed.",
  "Bare `ekzd` deterministically prints ordinary CLI help and exits successfully without entering an interactive terminal session.",
  "Bare `ekzd` does not depend on TTY detection, alternate-screen control, mouse-mode control, clipboard tooling, or interactive input.",
  "The dedicated `ekzd handoff` command is removed from CLI help and command dispatch.",
  "The semantic handoff-note mutation API and handoff-note-specific rendering are removed.",
  "New session state no longer initializes an obsolete handoff-note `done`/`next` container.",
  "Legacy session state containing an extra historical `handoff` field remains readable without requiring migration.",
  "`ekzd init`, `start`, `status`, `prompt`, `context`, `verify`, `check`, `abort`, and `finish` remain available.",
  "`ekzd prompt` continues rendering the frozen implementation contract.",
  "`ekzd context --json` remains valid machine-readable JSON.",
  "`ekzd check --help` remains available and worker-check behavior remains covered by the unchanged worker-check test suite.",
  "Session verification, exact-state binding, scope enforcement, protected-history enforcement, commit ceilings, and acceptance behavior remain intact.",
  "Human-readable explicit CLI output remains usable without the removed terminal application.",
  "TUI-only tests and dead TUI-only presentation helpers are removed rather than retained as unused compatibility code.",
  "README.md and VERIFICATION.md no longer document the removed interactive terminal/TUI or dedicated handoff-note command.",
  "Documentation continues to distinguish the maintainer session workflow from stateless worker checking.",
  "No runtime dependency is added.",
  "No build/version identity pinning is implemented in this task.",
  "All configured verification passes.",
]

[verification]

[[verification.steps]]
name = "compile"
command = ["python3", "-m", "compileall", "-q", "src", "tests"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "tests"
command = ["env", "PYTHONPATH=src", "python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
cwd = "."
timeout_seconds = 600

[[verification.steps]]
name = "cli-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--help"]
cwd = "."
timeout_seconds = 120
