schema_version = 1

[project]
name = "EkzD"

[sources]
paths = [
  "README.md",
  "VERIFICATION.md",
  "pyproject.toml",
  "src/ekzd/__init__.py",
  "src/ekzd/cli.py",
  "src/ekzd/check.py",
  "src/ekzd/task.py",
  "src/ekzd/worker.py",
  "tests/test_cli.py",
  "tests/test_task_manifest.py",
  "tests/test_worker_check.py",
]

[scope]
include = [
  "README.md",
  "VERIFICATION.md",
  "pyproject.toml",
  "src/ekzd/__init__.py",
  "src/ekzd/identity.py",
  "src/ekzd/cli.py",
  "src/ekzd/check.py",
  "src/ekzd/task.py",
  "src/ekzd/worker.py",
  "tests/test_cli.py",
  "tests/test_identity.py",
  "tests/test_task_manifest.py",
  "tests/test_worker_check.py",
]

exclude = [
  "src/ekzd/core.py",
  "src/ekzd/workflow.py",
  "src/ekzd/ui.py",
  "tests/test_core.py",
  "tests/test_ui.py",
  "tests/test_workflow_ux.py",
  "tests/test_verification_side_effects.py",
  ".github/**",
  ".ekzd/**",
]

constraints = [
  "Add exact EkzD runtime build identity and task-manifest schema-v2 pinning for stateless worker checks while preserving schema-v1 task compatibility.",
  "Use `src/ekzd/__init__.py` as the single source of the semantic package version and bump EkzD from 0.1.0 to 0.2.0.",
  "Configure setuptools package metadata to derive the package version from `ekzd.__version__` instead of maintaining a second hard-coded version.",
  "Add a deterministic runtime build SHA-256 derived from the Python source files of the EkzD package actually executing.",
  "The build fingerprint must not depend on Git metadata, repository history, installation directory, absolute paths, bytecode, cache files, or installer-specific metadata.",
  "Fingerprint all `.py` files recursively under the executing `ekzd` package directory in sorted POSIX-relative-path order.",
  "Bind both each relative path and its normalized source bytes into the digest with unambiguous separators.",
  "Normalize CRLF and lone CR source line endings to LF before hashing.",
  "A symlinked or unreadable `.py` package source, or inability to determine the package source set reliably, must make build identity unavailable rather than silently weakening the fingerprint.",
  "Expose semantic version and the full 64-character lowercase build SHA-256 through top-level `ekzd --version` without requiring an EkzD project checkout.",
  "Every stateless worker-check result must identify the executing EkzD semantic version and build SHA-256 in structured output when identity can be determined.",
  "Human-readable `ekzd check` output must display the executing EkzD version and build SHA-256.",
  "Introduce task-manifest schema version 2 without changing `.ekzd/project.toml` schema.",
  "Schema-v2 task manifests must require an `[ekzd]` table containing a non-empty `version` and an exact 64-character hexadecimal `build_sha256`.",
  "New EkzD must continue accepting schema-v1 task manifests.",
  "Schema-v1 worker checks must emit a clear non-blocking warning that the task does not pin the EkzD harness build.",
  "Schema-v2 worker checks must compare both required version and required build SHA-256 with the executing EkzD identity before any project or task verification command executes.",
  "A schema-v2 version or build mismatch must be blocking and must prevent project and task verification commands from executing.",
  "If executing EkzD build identity cannot be determined reliably, worker checking must fail closed and cannot report readiness.",
  "Preserve existing worker-check semantics for baseline ancestry, implementation branch, worktree mode, repository identity, scope, commit ceilings, protected history, Git visibility, verification mutation detection, result aggregation, and final clean-worktree requirements.",
  "Do not implement task-manifest export or generation in this task.",
  "Do not add networking, GitHub API behavior, orchestration, AI/model behavior, automatic repair, background behavior, or source mutation.",
  "Use only the Python standard library and existing setuptools tooling; add no runtime dependency.",
  "`ekzd --version` must exit non-zero with a clear error when exact runtime build identity cannot be determined; it must never substitute an `unknown`, partial, or placeholder build fingerprint.",
]

[authority]
may = [
  "Add `src/ekzd/identity.py` for runtime version and build identity.",
  "Add `tests/test_identity.py` and focused identity regression coverage.",
  "Change `pyproject.toml` so package version metadata derives from `ekzd.__version__`.",
  "Bump `ekzd.__version__` to 0.2.0.",
  "Add top-level `ekzd --version`.",
  "Extend worker result data and human rendering with EkzD identity.",
  "Extend task parsing to support task schema versions 1 and 2.",
  "Require and validate `[ekzd]` identity fields for schema-v2 task manifests.",
  "Add schema-v1 unpinned-harness warnings and schema-v2 blocking identity checks.",
  "Stop worker checking before target verification commands when schema-v2 identity does not match.",
  "Update README.md and VERIFICATION.md for the new identity and schema-v2 behavior.",
]

requires_approval = [
  "Changing `.ekzd/project.toml` schema.",
  "Dropping schema-v1 task-manifest compatibility.",
  "Changing existing schema-v1 task authority, scope, baseline, repository, commit-ceiling, or verification semantics.",
  "Changing maintainer session lifecycle or `ekzd verify`/`finish` acceptance semantics.",
  "Changing protected-history, Git-visibility, repository-identity, worktree-fingerprint, scope, or verification-mutation semantics.",
  "Adding task export or generation.",
  "Adding runtime dependencies.",
  "Adding networking, GitHub API integration, orchestration, AI/model functionality, automatic repair, or background behavior.",
]

may_not = [
  "Modify `src/ekzd/core.py`.",
  "Modify `src/ekzd/workflow.py`.",
  "Modify `src/ekzd/ui.py`.",
  "Modify `tests/test_core.py`.",
  "Modify `tests/test_ui.py`.",
  "Modify `tests/test_workflow_ux.py`.",
  "Modify `tests/test_verification_side_effects.py`.",
  "Modify `.github/**`.",
  "Modify `.ekzd/project.toml` or `.ekzd/session.json` during the implementation session.",
  "Require Git metadata to calculate runtime build identity.",
  "Use wheel `RECORD`, `dist-info`, or other installer-specific metadata as the canonical build fingerprint.",
  "Silently accept a schema-v2 task when version or build identity does not match.",
  "Run project or task verification commands after a schema-v2 harness identity mismatch.",
  "Add task-manifest export or generation.",
  "Add runtime dependencies.",
]

[session]
max_commits = 6

[acceptance]
criteria = [
  "`ekzd.__version__` is 0.2.0 and package metadata derives its version from that single source.",
  "`ekzd --version` works outside an EkzD project checkout and reports semantic version plus a full 64-character lowercase build SHA-256.",
  "The build SHA-256 is deterministic for identical EkzD Python source content regardless of package location.",
  "The build SHA-256 ignores bytecode/cache artifacts and normalizes source line endings as specified.",
  "Changing a fingerprinted Python source path or normalized source content changes the build SHA-256.",
  "Worker-check JSON identifies the executing EkzD semantic version and build SHA-256.",
  "Human-readable worker-check output displays the executing EkzD semantic version and build SHA-256.",
  "Schema-v1 task manifests remain accepted and produce a non-blocking warning that the harness build is not pinned.",
  "Schema-v2 task manifests require valid `[ekzd].version` and `[ekzd].build_sha256` fields.",
  "A schema-v2 task with matching version and build identity proceeds through normal worker checking.",
  "A schema-v2 task with mismatched version or build SHA-256 is blocking and does not execute project or task verification commands.",
  "If runtime build identity cannot be determined, worker checking cannot report readiness.",
  "Existing worker-check guarantees and schema-v1 semantics remain otherwise unchanged.",
  "README.md and VERIFICATION.md document build identity, `ekzd --version`, schema-v1 compatibility, and schema-v2 pinning.",
  "No task exporter, networking, orchestration, AI/model behavior, automatic repair, or runtime dependency is added.",
  "All configured verification passes.",
  "If exact runtime build identity cannot be determined, `ekzd --version` exits non-zero and worker checking cannot report readiness.",
]

[verification]

[[verification.steps]]
name = "compile"
command = ["python3", "-m", "compileall", "-q", "src", "tests"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "tests"
command = ["env", "PYTHONPATH=src", "python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
cwd = "."
timeout_seconds = 600

[[verification.steps]]
name = "cli-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--help"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "cli-version"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--version"]
cwd = "."
timeout_seconds = 120
