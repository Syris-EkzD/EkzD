schema_version = 1

[project]
name = "EkzD"

[sources]
paths = [
  "README.md",
  "src/ekzd/ui.py",
  "src/ekzd/interactive.py",
  "src/ekzd/workflow.py",
  "src/ekzd/terminal.py",
  "tests/test_ui.py",
  "tests/test_interactive.py",
  "tests/test_terminal.py",
  "tests/test_workflow_ux.py",
]

[scope]
include = [
  "README.md",
  "src/ekzd/ui.py",
  "src/ekzd/interactive.py",
  "src/ekzd/workflow.py",
  "src/ekzd/terminal.py",
  "tests/test_ui.py",
  "tests/test_interactive.py",
  "tests/test_terminal.py",
  "tests/test_workflow_ux.py",
]
exclude = [
  "src/ekzd/core.py",
  "src/ekzd/cli.py",
  ".github/**",
  "pyproject.toml",
  ".ekzd/**",
]
constraints = [
  "Harden EkzD’s bare interactive task-start and idle experience without changing workflow trust, verification, acceptance, scope, or Git semantics.",
  "Before the interactive Start task flow creates a session, require an explicit contract-review decision so the operator confirms whether the currently committed EkzD contract matches the proposed task.",
  "Contract review must present a concise summary of the currently committed contract, including useful scope/source counts and the configured session commit limit.",
  "Contract review must offer three clear outcomes: confirm and start, decline because the contract needs updating, or cancel.",
  "Declining contract review must not create or mutate an EkzD session; instead guide the operator to update and commit `.ekzd/project.toml` before trying again.",
  "Canceling contract review must return safely to the interactive home without creating a session.",
  "Do not attempt semantic AI-style detection of whether a contract matches an objective; the operator remains the authority who explicitly confirms it.",
  "Existing explicit `ekzd start` command behavior, flags, arguments, exit codes, and non-interactive compatibility must remain unchanged.",
  "Render the latest finished or aborted session as a structured secondary Previous task card rather than loose free text.",
  "The Previous task card must use only information already persisted in the existing session state and exposed through presentation status; do not add new persistence solely for this UI.",
  "At minimum, show previous task outcome, objective, implementation branch when available, verification state when available, and acceptance/result state when available.",
  "Previous task information must remain clearly historical and must never resemble the current active-task dashboard.",
  "Finished/accepted states should use success semantics, aborted or stale/not-run states should use warning semantics, and failed/blocked/error states should use failure semantics.",
  "Use consistent color semantics throughout human-readable interactive presentation: green for successful/passed/finished/accepted/clean states, yellow for warnings/aborted/stale/not-run states, red for failures/blocked/errors, and cyan/bold styling for structural labels and headings.",
  "Important labels such as Objective, Implementation branch, Verification, Result, Project, State, and Next must not be visually de-emphasized with dim styling.",
  "Reserve dim styling for genuinely secondary explanatory text, hints, timestamps, and low-priority metadata.",
  "Persistent terminal mode must prioritize current state over transcript history.",
  "Do not accumulate multiple full command summaries in the persistent home view after normal interactive actions such as invalid input, start, verify, abort, or acceptance.",
  "Persistent mode should surface only concise current/recent feedback needed to understand the latest action while retaining the authoritative current dashboard and available actions.",
  "Recent feedback must preserve appropriate success, warning, and failure coloring so errors remain obvious and successful operations are clearly distinguishable.",
  "Fallback/non-persistent interaction may continue to print sequential command output because it does not have a persistent redraw surface.",
  "Preserve the existing active-task dashboard information and workflow behavior unless a presentation adjustment is required for the stronger hierarchy described here.",
  "Preserve the existing idle primary card and Start task / Exit behavior apart from the new contract-review step when Start task is selected.",
  "Non-active workflow status may expose additional read-only fields derived from the existing persisted session state solely to support the richer Previous task presentation.",
  "Do not change the persisted session schema, session lifecycle, verification rules, acceptance rules, commit counting, scope enforcement, repository identity, or trust model.",
  "Keep `ekzd prompt` deterministic plain contract output and keep `ekzd context --json` structurally unchanged.",
  "Respect `NO_COLOR`, terminal capability detection, alternate-screen cleanup, and fallback behavior.",
  "Use only the Python standard library and add no runtime dependencies.",
]

[authority]
may = [
  "Add or adjust UI rendering helpers for interactive cards, labels, color semantics, recent feedback, and contract-review presentation.",
  "Adjust the persistent interactive controller so current state and only concise recent feedback are rendered instead of an accumulated transcript.",
  "Add a contract-review confirmation step to the bare interactive Start task flow before calling the existing session-start operation.",
  "Read the currently committed project contract for presentation in the interactive contract-review step.",
  "Expose additional read-only previous-session fields from existing persisted state through workflow presentation status.",
  "Adjust terminal presentation/history helpers only as needed to support concise state-aware feedback while preserving terminal lifecycle behavior.",
  "Add or update focused UI, interactive, terminal, and workflow UX tests.",
  "Update README.md to document the contract-review gate and revised interactive presentation.",
]
requires_approval = [
  "Changing behavior of the explicit `ekzd start` command or any other explicit command.",
  "Changing machine-readable output structures.",
  "Changing persisted project or session state structures.",
  "Adding historical task persistence beyond the existing latest session state.",
  "Changing task lifecycle, verification, acceptance, commit-budget enforcement, scope enforcement, Git enforcement, or trust semantics.",
  "Adding runtime dependencies.",
]
may_not = [
  "Modify src/ekzd/core.py.",
  "Modify src/ekzd/cli.py.",
  "Modify `.ekzd/project.toml` or `.ekzd/session.json` during the implementation session.",
  "Automatically decide whether a contract semantically matches a task objective.",
  "Create a task-history database or retain multiple historical sessions.",
  "Change `ekzd prompt` contract semantics.",
  "Change `ekzd context --json` structure.",
  "Add networking, GitHub integration, agent orchestration, AI/model functionality, or background behavior.",
]

[session]
max_commits = 20

[acceptance]
criteria = [
  "Selecting Start task in bare interactive mode collects the task objective and implementation branch and then presents an explicit contract-review step before any session is created.",
  "Contract review clearly summarizes the currently committed contract and offers confirm/start, update-contract-first, and cancel outcomes.",
  "Confirming contract review starts the session through the existing trusted start operation.",
  "Choosing update-contract-first creates no session, mutates no session state, and clearly instructs the operator to update and commit `.ekzd/project.toml` before retrying.",
  "Canceling contract review creates no session and safely returns to the interactive home.",
  "The explicit `ekzd start` command remains behaviorally unchanged.",
  "Idle persistent mode renders the latest finished or aborted session in a bordered Previous task card rather than loose text.",
  "The Previous task card clearly shows historical status and objective and shows implementation branch, verification, and result/acceptance information when available from existing state.",
  "A finished accepted task is visually distinguishable from an aborted task.",
  "A failed or blocked state uses failure coloring, an aborted/stale/not-run state uses warning coloring, and passed/finished/accepted states use success coloring.",
  "Important field labels are visually prominent and are not rendered as dim secondary metadata.",
  "Dim styling is reserved for genuinely secondary explanatory material.",
  "Persistent interactive mode no longer stacks multiple full command summaries into a transcript-like home screen during normal task lifecycle actions.",
  "The persistent home view shows authoritative current state plus only concise recent feedback needed to understand the latest action.",
  "Errors remain visible and red, warnings remain visible and yellow, and successful actions remain visible and green.",
  "Active-task dashboard information remains intact and correct.",
  "Idle primary card remains concise and clearly communicates that EkzD is ready for a new task.",
  "Fallback/non-persistent interaction remains readable and functionally compatible.",
  "NO_COLOR produces readable presentation without ANSI escapes.",
  "Alternate-screen entry/exit and terminal restoration behavior remain correct.",
  "No new session persistence or multi-task history storage is introduced.",
  "Workflow trust, verification, acceptance, scope, Git, and commit-budget semantics remain unchanged.",
  "`ekzd prompt` remains deterministic plain contract text.",
  "`ekzd context --json` remains structurally unchanged.",
  "README.md accurately describes the revised interactive flow.",
  "All configured verification passes.",
]

[verification]

[[verification.steps]]
name = "compile"
command = ["python3", "-m", "compileall", "-q", "src", "tests"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "tests"
command = ["env", "PYTHONPATH=src", "python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
cwd = "."
timeout_seconds = 600

[[verification.steps]]
name = "cli-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--help"]
cwd = "."
timeout_seconds = 120
