schema_version = 1

[project]
name = "EkzD"

[sources]
paths = [
  "README.md",
  "VERIFICATION.md",
  "src/ekzd/__init__.py",
  "src/ekzd/cli.py",
  "src/ekzd/core.py",
  "src/ekzd/identity.py",
  "src/ekzd/task.py",
  "src/ekzd/workflow.py",
  "src/ekzd/worker.py",
  "tests/test_cli.py",
  "tests/test_task_manifest.py",
  "tests/test_workflow_ux.py",
]

[scope]
include = [
  "README.md",
  "VERIFICATION.md",
  "src/ekzd/__init__.py",
  "src/ekzd/cli.py",
  "src/ekzd/task.py",
  "src/ekzd/workflow.py",
  "tests/test_cli.py",
  "tests/test_task_export.py",
  "tests/test_task_manifest.py",
  "tests/test_workflow_ux.py",
]

exclude = [
  "pyproject.toml",
  "src/ekzd/core.py",
  "src/ekzd/identity.py",
  "src/ekzd/check.py",
  "src/ekzd/worker.py",
  "src/ekzd/ui.py",
  "tests/test_core.py",
  "tests/test_identity.py",
  "tests/test_ui.py",
  "tests/test_worker_check.py",
  "tests/test_verification_side_effects.py",
  ".github/**",
  ".ekzd/**",
]

constraints = [
  "Add deterministic schema-v2 worker-task export from the active trusted maintainer session.",
  "Bump EkzD from 0.2.0 to 0.3.0 using `src/ekzd/__init__.py` as the existing single semantic-version source.",
  "Add an explicit `ekzd task` command without changing `.ekzd/project.toml` schema or the task-manifest schema.",
  "`ekzd task` with no output option must emit only the canonical schema-v2 TOML manifest to stdout so it can be redirected or piped without stripping presentation text.",
  "Support `ekzd task --output <path>` for writing the exact same manifest bytes to a portable file.",
  "An explicit task output path must resolve outside the EkzD project root so exporting a worker artifact cannot dirty or mutate the trusted maintainer worktree.",
  "If an output path already exists with byte-for-byte identical manifest content, export must succeed idempotently without rewriting it.",
  "If an output path already exists with different content, is not a regular file, or is a symlink, export must fail instead of silently overwriting or following it.",
  "File output must avoid leaving a partial destination if writing fails.",
  "Task export must use the same frozen active-session trust inputs used by `ekzd prompt`: the active session objective, session-start HEAD, declared implementation branch, frozen repository metadata, and committed session contract.",
  "Task export must enforce the active session contract and protected-session-history checks before producing authority.",
  "A legacy session that did not start from a clean reproducible baseline must not be allowed to export a portable task.",
  "Every exported manifest must use task `schema_version = 2`.",
  "Every exported manifest must pin the exact executing EkzD semantic version and runtime build SHA-256 using the existing runtime build identity mechanism.",
  "If exact executing EkzD build identity is unavailable, task export must fail closed and emit no usable task manifest.",
  "The exported manifest must contain the active objective, exact frozen baseline HEAD, declared implementation branch, configured maximum commit count, scope include/exclude lists, and acceptance criteria.",
  "When a sanitized repository identifier was frozen at session start, export it as the task `repository`; when no origin was recorded, omit the repository field rather than inventing one.",
  "Do not export mutable current HEAD, current worktree contents, timestamps, absolute installation paths, output paths, or other environment-specific values into the task manifest.",
  "For an unchanged active session and executing EkzD build, manifest bytes must be deterministic regardless of the current working directory within the project or chosen external output destination.",
  "Use one stable field/table ordering, UTF-8 text, LF newlines, valid TOML string escaping, and exactly one trailing newline.",
  "The emitted manifest must round-trip through the existing `load_task_manifest` parser without loss of any exported authority value.",
  "Do not copy project verification steps into the exported task `[verification]` table. Worker checking already obtains trusted project verification from `.ekzd/project.toml` at the frozen baseline, while task verification is additive; duplicating project steps would execute them twice.",
  "Do not export declared sources, scope constraints, or authority prose (`may`, `requires_approval`, `may_not`) as task-manifest keys because the current task schema does not enforce those fields; they remain part of the human implementation contract rendered by `ekzd prompt`.",
  "Do not change existing schema-v1 or schema-v2 task parsing or worker-check semantics except as strictly necessary to share deterministic manifest rendering helpers.",
  "Do not change `ekzd prompt` contract semantics; it remains the semantic implementation handoff.",
  "Update operator-facing workflow guidance so a newly started unchanged session points users toward both `ekzd prompt` and `ekzd task` as the two complementary handoff artifacts.",
  "Do not add networking, GitHub API behavior, orchestration, AI/model behavior, automatic repair, background behavior, or runtime dependencies.",
  "Use only the Python standard library and existing project tooling.",
  "Task export must be read-only with respect to the repository and active maintainer session; apart from an explicitly requested external output file, it must not modify `.ekzd/session.json`, verification state, Git state, project files, or any repository content.",
  "On any export failure, stdout mode must emit no manifest bytes and file-output mode must not create, truncate, replace, or partially update the requested destination.",
]

[authority]
may = [
  "Add deterministic schema-v2 task-manifest rendering helpers in `src/ekzd/task.py`.",
  "Add active-session task export assembly in `src/ekzd/workflow.py`.",
  "Add the `ekzd task` CLI command and `--output` option.",
  "Add safe external-file output handling for an explicitly requested task destination.",
  "Bump `ekzd.__version__` to 0.3.0.",
  "Add `tests/test_task_export.py` and focused export regressions.",
  "Update existing CLI, task-manifest, and workflow tests for the new explicit command and workflow guidance.",
  "Update README.md and VERIFICATION.md to document the semantic prompt plus machine task-manifest handoff workflow.",
]

requires_approval = [
  "Changing `.ekzd/project.toml` schema.",
  "Introducing task-manifest schema version 3 or changing existing schema-v1/schema-v2 authority semantics.",
  "Adding new task-manifest fields that existing worker checking does not enforce.",
  "Changing worker verification execution or result aggregation.",
  "Changing runtime build fingerprint semantics.",
  "Changing maintainer verification, finish, or acceptance semantics.",
  "Changing `ekzd prompt` semantic contract contents beyond narrowly mentioning the complementary task artifact where appropriate.",
  "Allowing task export to derive authority from mutable current implementation state instead of the frozen active-session baseline.",
  "Writing exported task artifacts inside the project worktree.",
  "Adding runtime dependencies.",
  "Adding networking, GitHub API integration, orchestration, AI/model behavior, automatic repair, or background behavior.",
]

may_not = [
  "Modify `pyproject.toml`.",
  "Modify `src/ekzd/core.py`.",
  "Modify `src/ekzd/identity.py`.",
  "Modify `src/ekzd/check.py`.",
  "Modify `src/ekzd/worker.py`.",
  "Modify `src/ekzd/ui.py`.",
  "Modify `tests/test_core.py`.",
  "Modify `tests/test_identity.py`.",
  "Modify `tests/test_ui.py`.",
  "Modify `tests/test_worker_check.py`.",
  "Modify `tests/test_verification_side_effects.py`.",
  "Modify `.github/**`.",
  "Modify `.ekzd/project.toml` or `.ekzd/session.json` during the implementation session.",
  "Export project verification steps as task verification steps by default.",
  "Export ignored or unenforced task keys for declared sources, scope constraints, or authority prose.",
  "Include timestamps, current implementation HEAD, current worktree state, output destination, absolute installation path, or other mutable/environment-specific data in manifest bytes.",
  "Silently overwrite a different existing output file.",
  "Write a task artifact inside the project root.",
  "Add task schema version 3.",
  "Add runtime dependencies.",
]

[session]
max_commits = 5

[acceptance]
criteria = [
  "`ekzd.__version__` is 0.3.0 and existing dynamic package metadata continues deriving from that single source.",
  "`ekzd task --help` is available as an explicit non-interactive CLI command.",
  "`ekzd task` on a valid active reproducible session emits only a valid schema-v2 TOML worker manifest to stdout.",
  "The exported manifest pins the exact executing EkzD semantic version and 64-character lowercase runtime build SHA-256.",
  "The exported manifest carries the frozen objective, baseline HEAD, implementation branch, commit ceiling, scope include/exclude lists, and acceptance criteria.",
  "A frozen repository identifier is exported when available and omitted when the session recorded no origin.",
  "The exported manifest contains no default task verification table and therefore does not duplicate baseline project verification commands.",
  "The exported manifest does not invent task fields for declared sources, prose constraints, or authority lists.",
  "Manifest bytes are deterministic for the same active session and EkzD build regardless of working directory within the project and external output destination.",
  "Manifest text uses stable ordering, UTF-8, LF line endings, valid TOML escaping, and exactly one trailing newline.",
  "Exported bytes round-trip through `load_task_manifest` with all exported authority values preserved.",
  "`ekzd task --output <external-path>` writes byte-for-byte the same content emitted by stdout mode.",
  "Writing to an existing byte-identical regular file succeeds idempotently without changing its contents.",
  "Writing to an existing different file, a symlink, non-regular destination, or a destination inside the project root fails without overwriting the destination.",
  "Task export fails closed when exact runtime build identity is unavailable.",
  "Task export rejects inactive, contract-invalid, protected-history-invalid, or non-reproducible legacy sessions rather than producing authority.",
  "Existing schema-v1/schema-v2 parsing, `ekzd check`, `ekzd prompt`, maintainer verification, and acceptance semantics remain otherwise unchanged.",
  "New-session workflow guidance surfaces both `ekzd prompt` and `ekzd task` as complementary handoff artifacts.",
  "README.md and VERIFICATION.md document how to export and use a schema-v2 worker task without implying that it replaces the semantic implementation prompt.",
  "No networking, orchestration, AI/model behavior, automatic repair, or runtime dependency is added.",
  "All configured verification passes.",
  "`ekzd task` does not mutate the active session, verification state, Git state, or repository contents.",
  "Any export failure leaves stdout free of partial manifest content and leaves the requested file destination unchanged or absent.",
]

[verification]

[[verification.steps]]
name = "compile"
command = ["python3", "-m", "compileall", "-q", "src", "tests"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "tests"
command = ["env", "PYTHONPATH=src", "python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
cwd = "."
timeout_seconds = 600

[[verification.steps]]
name = "cli-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--help"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "cli-version"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--version"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "task-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "task", "--help"]
cwd = "."
timeout_seconds = 120
