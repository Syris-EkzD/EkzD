schema_version = 4
name = "EkzD"
protected = [".github/"]
exclude = []
guidance = [
  "Keep EkzD deterministic and project-agnostic; use only the Python standard library.",
  "Preserve exact candidate binding and fail closed when required evidence is unavailable.",
  "Use coherent Conventional Commits at small, meaningful implementation milestones. Keep commits logically focused; avoid batching unrelated changes into one commit and avoid noisy WIP/checkpoint/fixup commits.",
  "Treat EkzD as structural authority verification only; project correctness belongs to CI or another external verifier.",
  "Do not claim implementation completion until required CI checks pass for the exact published candidate.",
  "Retain human merge authority.",
]
