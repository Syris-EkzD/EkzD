schema_version = 1

[project]
name = "EkzD"

[sources]
paths = [
  "README.md",
  "src/ekzd/core.py",
  "src/ekzd/workflow.py",
  "tests/test_core.py",
  "tests/test_session_budget.py",
  "tests/test_workflow_ux.py",
]

[scope]
include = [
  "README.md",
  "src/ekzd/core.py",
  "src/ekzd/workflow.py",
  "tests/test_core.py",
  "tests/test_session_budget.py",
  "tests/test_workflow_ux.py",
]
exclude = [
  "src/ekzd/cli.py",
  "src/ekzd/ui.py",
  "src/ekzd/interactive.py",
  "src/ekzd/terminal.py",
  ".github/**",
  "pyproject.toml",
  ".ekzd/**",
]
constraints = [
  "Standardize EkzD's session commit policy around a 20-commit hard safety ceiling while preserving existing commit-counting, verification, acceptance, scope, repository, and Git trust semantics except for the explicitly authorized budget-policy changes.",
  "Change EkzD's default session commit budget from 3 commits to 20 commits.",
  "New project contracts created by `ekzd init` must use `max_commits = 20`.",
  "When a project contract omits `session.max_commits`, EkzD must use the default value of 20.",
  "Configured session commit budgets must be positive integers no greater than 20.",
  "Reject configured commit budgets above 20 rather than silently clamping them.",
  "The value 20 is an absolute safety ceiling intended to stop runaway or hallucinated implementation work; it is not a target commit count.",
  "Implementation work should prefer small, logically isolated commits when multiple commits improve reviewability.",
  "Do not combine unrelated changes merely to reduce the number of commits.",
  "Do not encourage meaningless micro-commits solely to increase commit count; each commit should represent a coherent change.",
  "If an implementation session approaches the 20-commit ceiling, the implementation agent should stop and reassess or report that the task may be exceeding its intended scope rather than creating oversized commits to remain under the limit.",
  "Update the generated implementation handoff so the commit guidance clearly communicates that the configured maximum is a hard ceiling rather than a target and that small logical commits are preferred.",
  "Keep generated implementation prompts deterministic.",
  "Do not change how session commits are counted.",
  "Do not change how an over-budget active session is detected or blocked except as required to enforce the new maximum allowed configured budget.",
  "Do not change verification-state binding, acceptance rules, scope enforcement, repository identity, protected-path enforcement, or Git visibility rules.",
  "Do not change explicit CLI command names, arguments, exit-code behavior, or machine-readable output structures.",
  "Use only the Python standard library and add no runtime dependencies.",
]

[authority]
may = [
  "Change the default session commit-budget constant from 3 to 20.",
  "Change the project template produced by `ekzd init` so new contracts use `max_commits = 20`.",
  "Add validation that rejects configured session commit budgets greater than 20.",
  "Adjust human-readable validation errors as needed to clearly communicate the allowed commit-budget range.",
  "Strengthen generated implementation-prompt guidance around small logical commits and the 20-commit safety ceiling.",
  "Update README.md to document the standard commit-budget and commit-structure policy.",
  "Add or update focused tests for the new default, the 20-commit ceiling, explicit smaller budgets, invalid budgets, init output, and implementation-prompt guidance.",
]
requires_approval = [
  "Changing how commits are counted within an active session.",
  "Changing verification semantics beyond enforcing the authorized commit-budget policy.",
  "Changing acceptance semantics.",
  "Changing scope or protected-path enforcement.",
  "Changing repository identity or Git trust semantics.",
  "Changing explicit CLI behavior or machine-readable output structures.",
  "Adding runtime dependencies.",
]
may_not = [
  "Modify src/ekzd/cli.py.",
  "Modify src/ekzd/ui.py.",
  "Modify src/ekzd/interactive.py.",
  "Modify src/ekzd/terminal.py.",
  "Modify `.ekzd/project.toml` or `.ekzd/session.json` during the implementation session.",
  "Add automatic commit creation, squashing, rebasing, or history rewriting.",
  "Mechanically require a minimum number of commits.",
  "Automatically split implementation work into commits.",
  "Change verification, acceptance, scope, repository, or Git trust behavior unrelated to the commit-budget policy.",
  "Add networking, GitHub integration, orchestration, AI/model functionality, or background behavior.",
]

[session]
max_commits = 20

[acceptance]
criteria = [
  "EkzD's default session commit budget is 20.",
  "`ekzd init` creates a project contract containing `max_commits = 20`.",
  "A valid project contract that omits `session.max_commits` resolves to the default budget of 20.",
  "Explicit configured commit budgets from 1 through 20 remain valid.",
  "Configured commit budgets of 0, negative values, booleans, non-integers, or values greater than 20 are rejected.",
  "A session may contain up to 20 commits under a 20-commit budget and is rejected when the existing commit-counting rules determine that the configured budget has been exceeded.",
  "Existing support for explicitly smaller bounded session budgets remains intact.",
  "Generated implementation prompts describe the configured maximum as a hard safety ceiling rather than a target.",
  "Generated implementation prompts explicitly prefer small logical commits and state that unrelated work must not be combined merely to reduce commit count.",
  "Generated implementation prompts advise stopping and reassessing scope when approaching the commit ceiling rather than creating oversized commits.",
  "No minimum commit count is introduced.",
  "No automatic commit splitting, squashing, rebasing, or history rewriting is introduced.",
  "Commit-counting mechanics remain otherwise unchanged.",
  "Verification, acceptance, scope enforcement, protected-path enforcement, repository identity, and Git trust semantics remain unchanged.",
  "Explicit CLI command behavior and machine-readable output structures remain unchanged.",
  "README.md documents the 20-commit safety-ceiling policy and the preference for small logical commits.",
  "All configured verification passes.",
]

[verification]

[[verification.steps]]
name = "compile"
command = ["python3", "-m", "compileall", "-q", "src", "tests"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "tests"
command = ["env", "PYTHONPATH=src", "python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
cwd = "."
timeout_seconds = 600

[[verification.steps]]
name = "cli-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--help"]
cwd = "."
timeout_seconds = 120
