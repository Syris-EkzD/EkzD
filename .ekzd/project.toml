schema_version = 2
name = "EkzD"
protected = [".github/"]
exclude = []
max_commits = 20
guidance = [
  "Keep EkzD deterministic and project-agnostic; use only the Python standard library.",
  "Preserve exact candidate binding and fail closed when required evidence is unavailable.",
  "Use coherent Conventional Commits and retain human merge authority.",
]

[[verification]]
name = "compile"
command = ["python3", "-m", "compileall", "-q", "src", "tests"]
cwd = "."
timeout_seconds = 120

[[verification]]
name = "tests"
command = ["env", "PYTHONPATH=src", "python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
cwd = "."
timeout_seconds = 600

[[verification]]
name = "cli-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--help"]
cwd = "."
timeout_seconds = 120

[[verification]]
name = "cli-version"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--version"]
cwd = "."
timeout_seconds = 120

[[verification]]
name = "handoff-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "handoff", "--help"]
cwd = "."
timeout_seconds = 120
