schema_version = 1

[project]
name = "EkzD"

[sources]
paths = [
  "README.md",
  "src/ekzd/ui.py",
  "src/ekzd/interactive.py",
  "src/ekzd/workflow.py",
  "src/ekzd/terminal.py",
  "tests/test_ui.py",
  "tests/test_interactive.py",
  "tests/test_terminal.py",
]

[scope]
include = [
  "README.md",
  "src/ekzd/ui.py",
  "src/ekzd/interactive.py",
  "tests/test_ui.py",
  "tests/test_interactive.py",
  "tests/test_terminal.py",
]
exclude = [
  "src/ekzd/core.py",
  "src/ekzd/workflow.py",
  "src/ekzd/cli.py",
  "src/ekzd/terminal.py",
  ".github/**",
  "pyproject.toml",
  ".ekzd/**",
]
constraints = [
  "Improve the bare `ekzd` terminal experience when no task is active so idle state is visually distinct from an active task dashboard.",
  "Treat active-task and idle-state presentation as separate UI states rather than rendering finished or absent sessions through the active-task header layout.",
  "When a task is active, preserve the existing V1.4 operational dashboard behavior and information hierarchy.",
  "When no task is active, present EkzD as ready for a new task rather than making the previous task appear current.",
  "The idle header should communicate EkzD identity, concise product purpose, current project context where useful, and the recommended next action without active-session-only fields.",
  "Do not render meaningless idle placeholders such as `Branch (unknown)`, `Verification not run`, or `Commits ?` when there is no active session.",
  "If a previous finished or aborted session exists and its objective is available, show it only as secondary historical context outside the primary idle card.",
  "If no previous session exists, omit the previous-task section entirely.",
  "Previous-session presentation must clearly distinguish finished and aborted outcomes and must never imply that the previous task is still active.",
  "Keep the idle interface concise, polished, and appropriate for a consumer-grade terminal application rather than exposing internal or unavailable state.",
  "Existing state-aware actions must remain unchanged: idle state should continue to offer starting a task and exiting as currently appropriate.",
  "Do not change workflow status semantics, persisted session data, task lifecycle, verification, acceptance, scope enforcement, or Git enforcement.",
  "Existing explicit commands, flags, arguments, exit codes, and machine-readable output contracts must remain unchanged.",
  "Keep `ekzd prompt` deterministic plain contract output and `ekzd context --json` structurally unchanged.",
  "Respect `NO_COLOR` and existing terminal capability/fallback behavior.",
  "Use only the Python standard library and add no runtime dependencies.",
]

[authority]
may = [
  "Add or adjust UI rendering helpers that distinguish active-task and idle terminal states.",
  "Adjust the interactive presentation/controller only as needed to select the correct idle or active renderer from existing workflow status.",
  "Render previous finished or aborted task information as secondary historical context when existing workflow status already provides it.",
  "Add or update focused UI, interactive, and terminal presentation tests.",
  "Update README.md to document the idle terminal state accurately.",
]
requires_approval = [
  "Changing behavior or output of any existing explicit command.",
  "Changing the shape or semantics of workflow status data.",
  "Changing machine-readable output contracts.",
  "Changing persisted project or session state structures.",
  "Changing core or workflow logic.",
  "Adding runtime dependencies.",
]
may_not = [
  "Modify src/ekzd/core.py or src/ekzd/workflow.py.",
  "Modify src/ekzd/cli.py or src/ekzd/terminal.py.",
  "Change task lifecycle, verification, acceptance, scope, Git, or trust-model behavior.",
  "Add new persistence solely to retain previous-task history.",
  "Invent previous-task information that is not already available from existing state.",
  "Add networking, GitHub integration, agent orchestration, AI/model functionality, or background behavior.",
]

[session]
max_commits = 20

[acceptance]
criteria = [
  "Bare `ekzd` with an active session retains the existing V1.4 operational dashboard behavior and does not regress active-task information.",
  "Bare `ekzd` with no active session presents a clearly idle landing state instead of an active-task-style status card.",
  "The idle primary card identifies EkzD, communicates that it is ready for a new task, gives a concise description of its purpose, and surfaces the next action.",
  "Idle presentation does not show active-session-only placeholders such as unknown branch, not-run verification, or unknown commit count.",
  "A finished previous session is shown only as secondary historical context and is clearly labeled as finished.",
  "An aborted previous session is shown only as secondary historical context and is clearly labeled as aborted.",
  "If no previous session exists, no previous-task section is rendered.",
  "The previous task objective may be clipped for terminal width but must not be presented as the current task.",
  "The existing idle actions remain state-aware and continue to offer starting a task and exiting without workflow changes.",
  "Fallback/non-persistent interaction remains readable and semantically consistent.",
  "NO_COLOR remains respected.",
  "Existing explicit CLI commands retain their current behavior and output contracts.",
  "`ekzd prompt` remains deterministic plain contract text.",
  "`ekzd context --json` remains machine-readable and structurally unchanged.",
  "No core, workflow, persistence, trust-model, or dependency changes are introduced.",
  "README.md accurately describes the distinction between active-task and idle terminal presentation.",
  "All configured verification passes.",
]

[verification]

[[verification.steps]]
name = "compile"
command = ["python3", "-m", "compileall", "-q", "src", "tests"]
cwd = "."
timeout_seconds = 120

[[verification.steps]]
name = "tests"
command = ["env", "PYTHONPATH=src", "python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
cwd = "."
timeout_seconds = 600

[[verification.steps]]
name = "cli-help"
command = ["env", "PYTHONPATH=src", "python3", "-m", "ekzd.cli", "--help"]
cwd = "."
timeout_seconds = 120
