name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install .

      - name: Smoke test CLI
        run: ekzd --help

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test
        run: python -m unittest discover -s tests -v
