<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Animated EkzD terminal banner</title>
  <desc id="desc">A GitHub-dark terminal types ekzd init, reveals a readable six-line 3D ASCII EkzD header line by line, prints a short description, then waits on a new blinking prompt.</desc>

  <defs>
    <clipPath id="commandClip">
      <rect x="124" y="91" width="0" height="36">
        <animate attributeName="width" values="0;18;36;54;72;90;108;126;144;162" dur="1.05s" begin="0.35s" calcMode="discrete" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="descriptionClip">
      <rect x="154" y="433" width="0" height="36">
        <animate attributeName="width" values="0;32;64;96;128;160;192;224;256;288;320;352;384;416;448;480;512;544" dur="1.1s" begin="3.48s" calcMode="discrete" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="560" rx="22" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1197" height="557" rx="20.5" fill="none" stroke="#30363d" stroke-width="3"/>
  <path d="M24 64H1176" stroke="#30363d" stroke-width="2"/>

  <circle cx="35" cy="32" r="7" fill="#f85149"/>
  <circle cx="59" cy="32" r="7" fill="#d29922"/>
  <circle cx="83" cy="32" r="7" fill="#3fb950"/>
  <text x="110" y="38" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20">user: ~/Project</text>

