<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Animated EkzD terminal banner</title>
  <desc id="desc">A GitHub-dark terminal types ekzd init, reveals a bold white 3D EKZD wordmark line by line, prints a short description, then waits on a new blinking prompt.</desc>

  <defs>
    <clipPath id="commandClip">
      <rect x="124" y="91" width="0" height="36">
        <animate attributeName="width" values="0;18;36;54;72;90;108;126;144;162" dur="1.05s" begin="0.35s" calcMode="discrete" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="descriptionClip">
      <rect x="154" y="433" width="0" height="36">
        <animate attributeName="width" values="0;32;64;96;128;160;192;224;256;288;320;352;384;416;448;480;512;544" dur="1.1s" begin="3.48s" calcMode="discrete" fill="freeze"/>
      </rect>
    </clipPath>
    <g id="ekzdWordmark" shape-rendering="geometricPrecision">
      <!-- E -->
      <rect x="190" y="190" width="42" height="195"/>
      <rect x="190" y="190" width="155" height="42"/>
      <rect x="190" y="267" width="132" height="42"/>
      <rect x="190" y="343" width="155" height="42"/>

      <!-- K -->
      <rect x="390" y="190" width="42" height="195"/>
      <polygon points="428,268 505,190 557,190 458,292"/>
      <polygon points="430,287 466,270 560,385 506,385"/>

      <!-- Z -->
      <rect x="600" y="190" width="160" height="42"/>
      <polygon points="716,226 760,226 644,349 600,349"/>
      <rect x="600" y="343" width="160" height="42"/>

      <!-- D -->
      <rect x="810" y="190" width="42" height="195"/>
      <rect x="810" y="190" width="105" height="42"/>
      <rect x="810" y="343" width="105" height="42"/>
      <rect x="915" y="225" width="42" height="125"/>
      <rect x="900" y="205" width="42" height="42"/>
      <rect x="900" y="328" width="42" height="42"/>
    </g>
    <clipPath id="bannerSlice1"><rect x="170" y="170" width="860" height="45"/></clipPath>
    <clipPath id="bannerSlice2"><rect x="170" y="215" width="860" height="35"/></clipPath>
    <clipPath id="bannerSlice3"><rect x="170" y="250" width="860" height="35"/></clipPath>
    <clipPath id="bannerSlice4"><rect x="170" y="285" width="860" height="35"/></clipPath>
    <clipPath id="bannerSlice5"><rect x="170" y="320" width="860" height="35"/></clipPath>
    <clipPath id="bannerSlice6"><rect x="170" y="355" width="860" height="55"/></clipPath>
  </defs>

  <rect width="1200" height="560" rx="22" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1197" height="557" rx="20.5" fill="none" stroke="#30363d" stroke-width="3"/>
  <path d="M24 64H1176" stroke="#30363d" stroke-width="2"/>

  <circle cx="35" cy="32" r="7" fill="#f85149"/>
  <circle cx="59" cy="32" r="7" fill="#d29922"/>
  <circle cx="83" cy="32" r="7" fill="#3fb950"/>
  <text x="110" y="38" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20">user: ~/Project</text>

  <!-- Initial terminal input: only "$ ekzd init" is visible before output begins. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="25">
    <text x="98" y="118" fill="#8b949e">$</text>
    <text x="124" y="118" fill="#c9d1d9" clip-path="url(#commandClip)">ekzd init</text>
    <rect x="126" y="94" width="13" height="28" fill="#c9d1d9">
      <animate attributeName="x" values="126;144;162;180;198;216;234;252;270;288" dur="1.05s" begin="0.35s" calcMode="discrete" fill="freeze"/>
      <set attributeName="visibility" to="hidden" begin="1.55s" fill="freeze"/>
    </rect>
  </g>

  <!-- Blocky white EKZD wordmark with stepped outline extrusion, matching the Claude Code-style construction. -->
  <g>
    <g clip-path="url(#bannerSlice1)" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="1.72s" fill="freeze"/>
      <use href="#ekzdWordmark" transform="translate(15 15)" fill="#0d1117" stroke="#484f58" stroke-width="3"/>
      <use href="#ekzdWordmark" transform="translate(10 10)" fill="#0d1117" stroke="#6e7681" stroke-width="2.5"/>
      <use href="#ekzdWordmark" transform="translate(5 5)" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
      <use href="#ekzdWordmark" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="1"/>
    </g>
    <g clip-path="url(#bannerSlice2)" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="1.98s" fill="freeze"/>
      <use href="#ekzdWordmark" transform="translate(15 15)" fill="#0d1117" stroke="#484f58" stroke-width="3"/>
      <use href="#ekzdWordmark" transform="translate(10 10)" fill="#0d1117" stroke="#6e7681" stroke-width="2.5"/>
      <use href="#ekzdWordmark" transform="translate(5 5)" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
      <use href="#ekzdWordmark" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="1"/>
    </g>
    <g clip-path="url(#bannerSlice3)" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="2.24s" fill="freeze"/>
      <use href="#ekzdWordmark" transform="translate(15 15)" fill="#0d1117" stroke="#484f58" stroke-width="3"/>
      <use href="#ekzdWordmark" transform="translate(10 10)" fill="#0d1117" stroke="#6e7681" stroke-width="2.5"/>
      <use href="#ekzdWordmark" transform="translate(5 5)" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
      <use href="#ekzdWordmark" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="1"/>
    </g>
    <g clip-path="url(#bannerSlice4)" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="2.50s" fill="freeze"/>
      <use href="#ekzdWordmark" transform="translate(15 15)" fill="#0d1117" stroke="#484f58" stroke-width="3"/>
      <use href="#ekzdWordmark" transform="translate(10 10)" fill="#0d1117" stroke="#6e7681" stroke-width="2.5"/>
      <use href="#ekzdWordmark" transform="translate(5 5)" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
      <use href="#ekzdWordmark" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="1"/>
    </g>
    <g clip-path="url(#bannerSlice5)" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="2.76s" fill="freeze"/>
      <use href="#ekzdWordmark" transform="translate(15 15)" fill="#0d1117" stroke="#484f58" stroke-width="3"/>
      <use href="#ekzdWordmark" transform="translate(10 10)" fill="#0d1117" stroke="#6e7681" stroke-width="2.5"/>
      <use href="#ekzdWordmark" transform="translate(5 5)" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
      <use href="#ekzdWordmark" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="1"/>
    </g>
    <g clip-path="url(#bannerSlice6)" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="3.02s" fill="freeze"/>
      <use href="#ekzdWordmark" transform="translate(15 15)" fill="#0d1117" stroke="#484f58" stroke-width="3"/>
      <use href="#ekzdWordmark" transform="translate(10 10)" fill="#0d1117" stroke="#6e7681" stroke-width="2.5"/>
      <use href="#ekzdWordmark" transform="translate(5 5)" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
      <use href="#ekzdWordmark" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="1"/>
    </g>
  </g>

  <!-- Description appears only after the full header. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="3.36s" fill="freeze"/>
    <text x="98" y="462" fill="#8b949e"># ./</text>
    <text x="154" y="462" fill="#c9d1d9" clip-path="url(#descriptionClip)"> deterministic structural trust layer</text>
  </g>

  <!-- Only after all output is complete does the terminal move to a fresh input line. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="4.68s" fill="freeze"/>
    <text x="98" y="512" fill="#8b949e">$</text>
    <rect x="124" y="488" width="13" height="28" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="4.68s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
