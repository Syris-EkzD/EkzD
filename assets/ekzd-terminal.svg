<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Animated EkzD terminal banner</title>
  <desc id="desc">A GitHub-dark terminal types ekzd init, then reveals a six-line three-dimensional EkzD header and a short structural trust layer description.</desc>

  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="commandClip"><rect x="98" y="92" width="0" height="34"><animate attributeName="width" values="0;18;36;54;72;90;108;126;144;162" dur="1.05s" begin="0.35s" calcMode="discrete" fill="freeze"/></rect></clipPath>
    <clipPath id="descClip"><rect x="98" y="454" width="0" height="34"><animate attributeName="width" values="0;40;80;120;160;200;240;280;320;360;400;440;480;520;560;600" dur="1.15s" begin="3.25s" calcMode="discrete" fill="freeze"/></rect></clipPath>

    <clipPath id="slice1"><rect x="105" y="184" width="990" height="35"/></clipPath>
    <clipPath id="slice2"><rect x="105" y="219" width="990" height="35"/></clipPath>
    <clipPath id="slice3"><rect x="105" y="254" width="990" height="35"/></clipPath>
    <clipPath id="slice4"><rect x="105" y="289" width="990" height="35"/></clipPath>
    <clipPath id="slice5"><rect x="105" y="324" width="990" height="35"/></clipPath>
    <clipPath id="slice6"><rect x="105" y="359" width="990" height="40"/></clipPath>
  </defs>

  <rect width="1200" height="560" rx="22" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1197" height="557" rx="20.5" fill="none" stroke="#30363d" stroke-width="3"/>
  <path d="M24 64H1176" stroke="#30363d" stroke-width="2"/>

  <circle cx="35" cy="32" r="7" fill="#f85149"/>
  <circle cx="59" cy="32" r="7" fill="#d29922"/>
  <circle cx="83" cy="32" r="7" fill="#3fb950"/>
  <text x="110" y="38" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20">user: ~/Project</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="25">
    <text x="98" y="118" fill="#8b949e">$</text>
    <text x="124" y="118" fill="#c9d1d9" clip-path="url(#commandClip)">ekzd init</text>
    <rect x="126" y="94" width="13" height="28" fill="#c9d1d9">
      <animate attributeName="x" values="126;144;162;180;198;216;234;252;270;288" dur="1.05s" begin="0.35s" calcMode="discrete" fill="freeze"/>
      <set attributeName="visibility" to="hidden" begin="1.55s" fill="freeze"/>
    </rect>
  </g>

  <!-- The same 3D wordmark is clipped into exactly six horizontal terminal-style rows. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="260" font-weight="800" fill="none" stroke-linejoin="miter" stroke-linecap="butt" stroke-dasharray="12 4" transform="matrix(1 0 -0.16 0.72 10 125)">
    <g clip-path="url(#slice1)" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.72s" fill="freeze"/>
      <text x="165" y="405" stroke="#1f6feb" stroke-opacity=".34" stroke-width="8" transform="translate(13 12)">EkzD</text><text x="165" y="405" stroke="#f0f6fc" stroke-width="2.8">EkzD</text></g>
    <g clip-path="url(#slice2)" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.96s" fill="freeze"/>
      <text x="165" y="405" stroke="#1f6feb" stroke-opacity=".34" stroke-width="8" transform="translate(13 12)">EkzD</text><text x="165" y="405" stroke="#f0f6fc" stroke-width="2.8">EkzD</text></g>
    <g clip-path="url(#slice3)" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.20s" fill="freeze"/>
      <text x="165" y="405" stroke="#1f6feb" stroke-opacity=".34" stroke-width="8" transform="translate(13 12)">EkzD</text><text x="165" y="405" stroke="#f0f6fc" stroke-width="2.8">EkzD</text></g>
    <g clip-path="url(#slice4)" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.44s" fill="freeze"/>
      <text x="165" y="405" stroke="#1f6feb" stroke-opacity=".34" stroke-width="8" transform="translate(13 12)">EkzD</text><text x="165" y="405" stroke="#f0f6fc" stroke-width="2.8">EkzD</text></g>
    <g clip-path="url(#slice5)" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.68s" fill="freeze"/>
      <text x="165" y="405" stroke="#1f6feb" stroke-opacity=".34" stroke-width="8" transform="translate(13 12)">EkzD</text><text x="165" y="405" stroke="#f0f6fc" stroke-width="2.8">EkzD</text></g>
    <g clip-path="url(#slice6)" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.92s" fill="freeze"/>
      <text x="165" y="405" stroke="#1f6feb" stroke-opacity=".34" stroke-width="8" transform="translate(13 12)">EkzD</text><text x="165" y="405" stroke="#f0f6fc" stroke-width="2.8">EkzD</text></g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" clip-path="url(#descClip)">
    <text x="98" y="480" fill="#8b949e"># ./</text>
    <text x="158" y="480" fill="#c9d1d9"> deterministic structural trust layer</text>
  </g>

  <rect x="641" y="456" width="13" height="29" fill="#58a6ff" visibility="hidden" filter="url(#softGlow)">
    <set attributeName="visibility" to="visible" begin="4.40s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="4.40s" repeatCount="4" fill="freeze"/>
  </rect>
</svg>
